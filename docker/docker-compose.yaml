services:
  postgres:
    image: 'postgres:17'
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_DB: ${POSTGRES_STORENAME}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - goapp_network

  goapp:
    image: cosmtrek/air:latest #change to golang:version
    volumes:
      - ${PWD}:/app
    working_dir: /app
    tty: true
    environment:
      ENV: ${ENV}
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      JWT_SECRET: ${JWT_SECRET}
      TEMPLATES_BASEPATH: /app/cmd/server/http/web/templates
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_STORENAME: ${POSTGRES_STORENAME}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ENABLE_METRICS: ${ENABLE_METRICS}
      ENABLE_TRACING: ${ENABLE_TRACING}
      AEROSPIKE_HOST: aerospike
      AEROSPIKE_PORT: 3000
      AEROSPIKE_NAMESPACE: test
    ports:
      - '8080:8080'
      - '2000:2000'
      - '9090:9090'
    depends_on:
      - postgres
      - aerospike
    networks:
      - goapp_network

  aerospike:
    image: aerospike/aerospike-server:8.1
    container_name: aerospike-server
    ports:
      - "3000:3000" # Client connection port
      - "3001:3001" # Fabric clustering port
      - "3002:3002" # Heartbeat port
    volumes:
      # NOTE: the stock config keeps namespace `test` in memory, so nothing is
      # written here and tokens are lost on restart. Fine for local dev; mount
      # an aerospike.conf with a persistent storage-engine if you need more.
      - aerospike-data:/opt/aerospike/data
      # UNCOMMENT below lines if using Enterprise Edition to mount your feature key
      # - ./aerospike.conf:/etc/aerospike/aerospike.conf
      # - ./features.conf:/etc/aerospike/features.conf
    networks:
      - goapp_network

  # CLI tools (aql, asadm). Off by default -- `docker compose --profile tools up -d`,
  # then `docker compose exec aerospike-tools aql -h aerospike`.
  aerospike-tools:
    image: aerospike/aerospike-tools:latest
    container_name: aerospike-tools
    profiles: [tools]
    depends_on:
      - aerospike
    environment:
      - AEROSPIKE_HOST=aerospike
    entrypoint: ["tail", "-f", "/dev/null"] # Keeps the container running
    networks:
      - goapp_network

networks:
  goapp_network:

volumes:
  postgres_data:
  aerospike-data:
